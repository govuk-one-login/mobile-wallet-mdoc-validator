name: Mdoc Validator - Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-code-quality-and-security-analysis:
    name: Run code quality and security analysis
    if: github.triggering_actor != 'dependabot[bot]'
    uses: ./.github/workflows/sonarqube.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  validate:
    name: Validate
    uses: ./.github/workflows/validate.yaml

  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check commit messages
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          # Only check commits introduced by the PR
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - run-code-quality-and-security-analysis
      - validate
      - conventional-commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify all preceding jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
