name: Mdoc Validator - Verify Release Credentials

# Manual, read-only diagnostic. Validates the release auth chain end to end
# WITHOUT performing a release:
#   1. GitHub OIDC -> assume the AWS IAM role.
#   2. Read the GitHub App credentials from AWS Secrets Manager.
#   3. Mint a GitHub App installation token and confirm it is usable.
# No bump, no tag, no push, no publish.

on:
  push:
    branches: [DCMAW-23155]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-credentials:
    name: Verify release credentials
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Required to mint the GitHub OIDC token for AWS role assumption.
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm AWS role assumption
        run: |
          set -euo pipefail
          CALLER="$(aws sts get-caller-identity --query Arn --output text)"
          echo "Assumed role identity: ${CALLER}"
          echo "::notice::AWS OIDC role assumption succeeded (${CALLER})."

      # Reads the App credentials and exposes them as env vars CLIENT_ID / PRIVATE_KEY.
      - name: Fetch App credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,ci/release_action/mdoc_release_app_mdoc_validator
          parse-json-secrets: true

      - name: Confirm secret was read
        run: |
          set -euo pipefail
          if [ -z "${CLIENT_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::Secret read but CLIENT_ID / PRIVATE_KEY are empty - check the secret JSON keys."
            exit 1
          fi
          # Only confirm presence; never print the values.
          echo "::notice::Secrets Manager read succeeded (client_id and private_key present)."

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ env.CLIENT_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Confirm App token works
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # The App bot must resolve (same call the release workflow uses for identity).
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "App slug: ${APP_SLUG}  bot user id: ${USER_ID}"
          # Confirm the token can see this repository (Contents: read/write permission).
          REPO_FULL="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .full_name)"
          echo "Token can access repository: ${REPO_FULL}"
          echo "::notice::GitHub App token minted and verified for ${APP_SLUG}."

      - name: Summary
        run: echo "::notice::All checks passed - OIDC, Secrets Manager read, and App token minting all work."
